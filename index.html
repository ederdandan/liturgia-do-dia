<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liturgia do Dia</title>
  <meta name="description" content="Liturgia diária, santo do dia, reflexão e Catena Aurea.">

  <!-- Aplica tema e fonte salvos antes da renderização para evitar flash -->
  <script>
    try {
      var t = localStorage.getItem('pref:tema');
      if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      document.documentElement.dataset.theme = t || 'light';
      var f = localStorage.getItem('pref:fonte');
      if (f) document.documentElement.style.setProperty('--escala-fonte', f);
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Georgia', 'serif'],
            display: ['Cinzel', 'Georgia', 'serif'],
          },
          colors: {
            fundo: 'var(--fundo)',
            superficie: 'var(--superficie)',
            texto: 'var(--texto)',
            suave: 'var(--suave)',
            borda: 'var(--borda)',
            liturgica: 'var(--cor-liturgica)',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-fundo text-texto font-serif antialiased">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:p-2">Pular para o conteúdo</a>

  <!-- ===== Cabeçalho ===== -->
  <header id="cabecalho" class="ocultavel border-b border-borda">
    <div class="mx-auto max-w-3xl px-4 pt-2 pb-3 md:pt-4 md:pb-5">
      <!-- Celular: [‹ data ›  Hoje] .......... [Aa]
           Computador: LITURGIA DO DIA ..... [A- A+ tema foco] / [‹ data por extenso ›] -->
      <div class="flex flex-wrap items-center gap-x-2">
        <p class="hidden md:block md:order-1 md:flex-1 font-display text-xs tracking-[0.25em] text-suave">LITURGIA DO DIA</p>

        <!-- Navegação por data -->
        <div class="order-1 md:order-3 md:basis-full md:mt-4 flex min-w-0 flex-1 items-center gap-1 md:gap-2">
          <button id="btn-anterior" class="btn-icone" type="button" aria-label="Dia anterior" title="Dia anterior">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <label class="relative min-w-0 cursor-pointer">
            <span id="data-curta" class="md:hidden text-sm font-semibold underline decoration-dotted underline-offset-4"></span>
            <span id="data-extenso" class="hidden md:inline text-sm text-suave underline decoration-dotted underline-offset-4"></span>
            <input id="seletor-data" type="date" class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Escolher data">
          </label>
          <button id="btn-proximo" class="btn-icone" type="button" aria-label="Próximo dia" title="Próximo dia">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button id="btn-hoje" class="hidden ml-1 text-xs text-liturgica underline underline-offset-4" type="button">Hoje</button>
        </div>

        <!-- Controles de leitura: menu "Aa" no celular, botões visíveis no computador -->
        <div class="relative order-2">
          <button id="btn-ajustes" class="btn-icone md:hidden" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="controles" aria-label="Ajustes de leitura" title="Ajustes de leitura">
            <span class="font-display text-sm">Aa</span>
          </button>
          <div id="controles" class="controles" role="toolbar" aria-label="Controles de leitura">
          <button id="btn-fonte-menos" class="btn-icone" type="button" aria-label="Diminuir fonte" title="Diminuir fonte">
            <span class="text-xs">A</span><span class="text-[0.6rem]">−</span>
          </button>
          <button id="btn-fonte-mais" class="btn-icone" type="button" aria-label="Aumentar fonte" title="Aumentar fonte">
            <span class="text-base">A</span><span class="text-[0.6rem]">+</span>
          </button>
          <button id="btn-tema" class="btn-icone" type="button" aria-label="Alternar tema" title="Tema">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>
            </svg>
          </button>
          <button id="btn-foco" class="btn-icone" type="button" aria-label="Modo leitura sem distrações" title="Modo foco (Esc para sair)">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
            </svg>
          </button>
          </div>
        </div>
      </div>

      <!-- Título litúrgico e cor -->
      <div class="mt-1 md:mt-3 flex items-start gap-3 pl-1 md:pl-0">
        <span id="cor-indicador" class="indicador-cor mt-1.5 md:mt-2" aria-hidden="true"></span>
        <div class="min-w-0">
          <h1 id="titulo-liturgico" class="font-display text-base sm:text-2xl leading-snug"></h1>
          <p id="cor-nome" class="hidden md:block mt-1 text-xs text-suave"></p>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Abas ===== -->
  <!-- No celular: barra fixa inferior com ícones. No computador: abas no topo. -->
  <nav id="barra-abas" class="ocultavel" aria-label="Seções">
    <div id="abas" role="tablist">
      <button role="tab" id="aba-liturgia" aria-controls="painel-liturgia" data-aba="liturgia" class="aba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5c-3.5-.5-6.5 0-8.5 1.5Z"/><path d="M12 6.5v13"/>
        </svg>
        <span>Liturgia</span>
      </button>
      <button role="tab" id="aba-santo" aria-controls="painel-santo" data-aba="santo" class="aba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="3.6" rx="4" ry="1.3"/><circle cx="12" cy="9" r="3.2"/><path d="M5.5 20.5c.6-3.8 3.2-6 6.5-6s5.9 2.2 6.5 6"/>
        </svg>
        <span>Santo</span>
      </button>
      <button role="tab" id="aba-reflexao" aria-controls="painel-reflexao" data-aba="reflexao" class="aba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3c.9 1.6 2.2 2.6 2.2 4.4a2.2 2.2 0 0 1-4.4 0C9.8 5.6 11.1 4.6 12 3Z"/><rect x="9" y="10.5" width="6" height="10" rx="1"/><path d="M6 20.5h12"/>
        </svg>
        <span>Reflexão</span>
      </button>
      <button role="tab" id="aba-catena" aria-controls="painel-catena" data-aba="catena" class="aba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.5 14.5 14.5 9.5"/><path d="M11 6.5 12.6 5a3.9 3.9 0 0 1 5.5 5.5L16.5 12"/><path d="M13 17.5 11.4 19a3.9 3.9 0 0 1-5.5-5.5L7.5 12"/>
        </svg>
        <span class="md:hidden">Catena</span><span class="hidden md:inline">Catena Aurea</span>
      </button>
      <button role="tab" id="aba-salvos" aria-controls="painel-salvos" data-aba="salvos" class="aba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/>
        </svg>
        <span>Salvos</span>
      </button>
    </div>
  </nav>

  <!-- ===== Conteúdo ===== -->
  <main id="conteudo" class="mx-auto max-w-3xl px-4 py-8 leitura">
    <section role="tabpanel" id="painel-liturgia" aria-labelledby="aba-liturgia" tabindex="0"></section>
    <section role="tabpanel" id="painel-santo" aria-labelledby="aba-santo" tabindex="0" hidden></section>
    <section role="tabpanel" id="painel-reflexao" aria-labelledby="aba-reflexao" tabindex="0" hidden></section>
    <section role="tabpanel" id="painel-catena" aria-labelledby="aba-catena" tabindex="0" hidden></section>
    <section role="tabpanel" id="painel-salvos" aria-labelledby="aba-salvos" tabindex="0" hidden></section>
  </main>

  <!-- Saída do modo foco -->
  <button id="btn-sair-foco" type="button" class="btn-icone fixed bottom-4 right-4 hidden shadow" aria-label="Sair do modo foco" title="Sair do modo foco (Esc)">
    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </svg>
  </button>

  <footer class="ocultavel mx-auto max-w-3xl px-4 pt-8 pb-28 md:pb-8 text-xs text-suave">
    Uso pessoal e não comercial. Fontes: Liturgia Diária API (CNBB), Evangelizo.org, Wikipedia, Commentaries-Database.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
